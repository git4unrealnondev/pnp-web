[package]
name = "pnp-logic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pnp-logic"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_types = {path = "./libs/shared_types"}
vision-functions = { package = "vision-functions", path = "./libs/vision-functions" }
hwcontrol = { package = "hwcontrol", path = "./libs/hwcontrol" }
pnp-capture = { path = "libs/pnp-capture" }
